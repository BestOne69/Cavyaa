name: CAVYAA Bulk Data Download

# Trigger this manually from GitHub's "Actions" tab (workflow_dispatch),
# or automatically on a schedule if you uncomment the schedule block below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * *'  # runs daily at 3am UTC, if you want it recurring

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's max for a single job on free tier (~6 hours)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas pysam 

      - name: Run bulk download script
        run: python3 main.py

      - name: Commit results back to the repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fragment_features_wide.csv
          git commit -m "Auto-update: bulk download results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push

      - name: Upload as artifact (backup, in case commit fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fragment_features_raw_pipeline
          path: fragment_features_raw_pipeline.csv
          retention-days: 30

      - name: Cache reference genome and BWA index
        uses: actions/cache@v4
        with:
          path: |
            hg19.fa
            hg19.fa.fai
            hg19.fa.bwt
            hg19.fa.pac
            hg19.fa.ann
            hg19.fa.amb
            hg19.fa.sa
          key: hg19-reference-bwa-index-v1 
          
